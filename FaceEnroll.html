<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Face ID</title>
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17202a;font:15px Arial,sans-serif}.wrap{max-width:760px;margin:24px auto;padding:18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #00000010}h2{margin:0 0 8px;color:#9f1239}p{line-height:1.5;color:#526071}.camera{background:#111;border-radius:12px;overflow:hidden;min-height:240px;display:flex;align-items:center;justify-content:center}video{width:100%;max-height:460px;object-fit:cover;transform:scaleX(-1);display:none}button{border:0;border-radius:9px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:8px 6px 0 0;background:#b91c1c;color:white}button.secondary{background:#e8edf3;color:#263445}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;padding:12px;border-radius:9px;background:#f1f5f9;white-space:pre-wrap}.ok{background:#e8f7ef;color:#146c43}.err{background:#fff0f0;color:#a61b1b}.samples{font-weight:bold;margin:12px 0}.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;line-height:1.5}.consent input{margin-top:4px}
</style></head>
<body><div class="wrap"><div class="card">
<h2>PENDAFTARAN FACE ID</h2><p id="employeeInfo">Memeriksa sesi pendaftaran...</p>
<div class="camera"><video id="video" autoplay muted playsinline></video><span id="placeholder" style="color:white;padding:25px;text-align:center">Kamera belum diaktifkan</span></div>
<div><button id="startBtn" onclick="startCamera()">AKTIFKAN KAMERA</button><button class="secondary" id="stopBtn" onclick="stopCamera()" disabled>MATIKAN KAMERA</button><button class="secondary" id="captureBtn" onclick="captureSample()" disabled>AMBIL SAMPEL</button><button class="secondary" onclick="resetSamples()">ULANGI SAMPEL</button></div>
<div class="samples" id="sampleCount">0 / 5 sampel (minimal 3)</div>
<label class="consent"><input type="checkbox" id="consent"><span>Saya telah menjelaskan tujuan penggunaan Face ID kepada karyawan dan memperoleh persetujuan eksplisit untuk pemrosesan data biometrik wajahnya.</span></label>
<button id="saveBtn" onclick="saveSamples()" disabled>SIMPAN TEMPLATE WAJAH</button>
<div class="status" id="status">Sesi berlaku selama 10 menit. Pastikan tablet terhubung ke internet.</div>
</div></div>
<script>
const SESSION = <?!= JSON.stringify(sessionToken) ?>;
const SCRIPT_URL = <?!= JSON.stringify(scriptUrl) ?>;
const MODEL_URL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
let stream=null, samples=[], modelsReady=false, employee=null, saving=false;
function msg(t,kind){const el=document.getElementById('status');el.textContent=t;el.className='status '+(kind||'');}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='faceCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const url=new URL(SCRIPT_URL);Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));url.searchParams.set('callback',cb);const timer=setTimeout(()=>{cleanup();reject(new Error('Koneksi ke server timeout.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.src=url.toString();script.onerror=()=>{cleanup();reject(new Error('Tidak dapat menghubungi Apps Script.'))};document.head.appendChild(script)});}
async function init(){try{if(!SESSION)throw new Error('Token sesi kosong. Buka halaman ini dari tombol Admin.');const r=await jsonp({action:'faceenrollinfo',session:SESSION});if(!r.success)throw new Error(r.message||'Sesi tidak valid.');employee=r.employee;document.getElementById('employeeInfo').textContent='Karyawan: '+employee.name+' · ID '+employee.id+' · '+employee.department;msg('Sesi siap. Aktifkan kamera untuk mengambil 3–5 sampel.','ok')}catch(e){msg(e.message,'err');document.getElementById('startBtn').disabled=true}}
async function loadModels(){if(modelsReady)return;if(!window.faceapi)throw new Error('Library Face ID belum termuat. Periksa internet lalu muat ulang.');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);modelsReady=true}
async function startCamera(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Browser tidak mendukung kamera. Buka halaman ini di Chrome melalui HTTPS.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false});const v=document.getElementById('video');v.srcObject=stream;v.style.display='block';document.getElementById('placeholder').style.display='none';await v.play();await loadModels();document.getElementById('captureBtn').disabled=false;document.getElementById('startBtn').disabled=true;document.getElementById('stopBtn').disabled=false;msg('Kamera aktif. Ambil sampel normal, sedikit ke kiri, dan sedikit ke kanan.','ok')}catch(e){stopCamera();msg(e.message||String(e),'err')}}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=document.getElementById('video');if(v){v.pause();v.srcObject=null;v.style.display='none'}const ph=document.getElementById('placeholder');if(ph)ph.style.display='block';const cap=document.getElementById('captureBtn');if(cap)cap.disabled=true;const start=document.getElementById('startBtn');if(start)start.disabled=false;const stop=document.getElementById('stopBtn');if(stop)stop.disabled=true}
async function captureSample(){try{if(!stream)throw new Error('Aktifkan kamera terlebih dahulu.');if(samples.length>=5)throw new Error('Maksimal 5 sampel.');const v=document.getElementById('video');const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!d)throw new Error('Wajah belum terdeteksi. Hadapkan wajah ke kamera dan pastikan cahaya cukup.');samples.push(Array.from(d.descriptor));updateSamples();msg('Sampel '+samples.length+' berhasil diambil.','ok')}catch(e){msg(e.message||String(e),'err')}}
function updateSamples(){document.getElementById('sampleCount').textContent=samples.length+' / 5 sampel (minimal 3)';document.getElementById('saveBtn').disabled=samples.length<3||!document.getElementById('consent').checked||saving}
function resetSamples(){samples=[];updateSamples();msg('Sampel diulang. Ambil kembali minimal 3 sampel.','')}
document.getElementById('consent').addEventListener('change',updateSamples);
function saveSamples(){if(saving)return;if(samples.length<3||samples.length>5)return msg('Ambil 3–5 sampel terlebih dahulu.','err');if(!document.getElementById('consent').checked)return msg('Persetujuan wajib dicentang.','err');saving=true;updateSamples();msg('Mengirim template wajah ke server...','');const payload={action:'saveFaceEnrollmentSession',session:SESSION,descriptors:samples,consent:true};const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='faceSaveTarget';form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);const frame=document.createElement('iframe');frame.name='faceSaveTarget';frame.style.display='none';document.body.appendChild(frame);document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();frame.remove()},5000);pollSaveStatus();}
async function pollSaveStatus(){try{for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,2000));const r=await jsonp({action:'faceenrollstatus',session:SESSION});if(r&&r.success){stopCamera();msg(r.message||'Template berhasil disimpan.','ok');document.getElementById('saveBtn').disabled=true;saving=false;return;}if(r&&r.message&&r.message.indexOf('kedaluwarsa')<0&&r.message.indexOf('tidak ditemukan')<0)throw new Error(r.message)}throw new Error('Server belum mengonfirmasi penyimpanan. Periksa status Face ID dari Admin.')}catch(e){msg(e.message||String(e),'err')}finally{saving=false;updateSamples()}}
window.addEventListener('beforeunload',stopCamera);init();
</script></body></html>
